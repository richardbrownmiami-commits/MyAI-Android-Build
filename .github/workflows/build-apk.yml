name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Build reason (optional)'
        required: false
        default: 'Manual build from BrainForge APK Builder'
  push:
    branches:
      - main
      - brain-native-armv7

jobs:
  brain-native:
    runs-on: ubuntu-latest
    name: Build native brain smoke test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure brain
        run: cmake -S brain -B brain/build -DBRAIN_BUILD_SMOKE=ON
      - name: Build brain
        run: cmake --build brain/build --parallel
      - name: Run brain smoke test
        working-directory: brain/build
        run: ./brain_native_smoke

  build:
    runs-on: ubuntu-latest
    name: Build Debug APK
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify ARMv7 APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/armeabi-v7a/'
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk-armv7
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
